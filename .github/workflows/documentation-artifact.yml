name: Documentation validation
on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      pages_artifact:
        description: Upload the validated site for the master-only Pages deploy
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-docs.txt
      - run: python -m pip install -e .
      - run: python tools/check_architecture_docs.py --examples --getting-started --api-reference --tutorials --showcase --website
      - run: python -m mkdocs build --strict
      - run: python tools/check_site.py --site-dir site
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation-preview
          path: site
          if-no-files-found: error
          retention-days: 7
      - name: Upload checked Pages artifact
        if: inputs.pages_artifact && github.repository == 'AlexMarinescu/pyGameMath' && github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

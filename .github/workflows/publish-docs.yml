name: Publish documentation to GitHub Pages
on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'examples/**'
      - 'gem/**'
      - 'tools/**'
      - 'ROADMAP.md'
      - 'README.md'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/documentation-artifact.yml'
      - '.github/workflows/publish-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'AlexMarinescu/pyGameMath' && github.ref == 'refs/heads/master'
    uses: ./.github/workflows/documentation-artifact.yml
    with:
      pages_artifact: true
  deploy:
    needs: build
    if: github.repository == 'AlexMarinescu/pyGameMath' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

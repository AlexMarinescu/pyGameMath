<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img">
<title>Transformation order</title>
<desc>Matrix * Vector evaluates the row product vM; A * B applies A, then B</desc>
<rect width="960" height="560" fill="#f5f8fb"/>

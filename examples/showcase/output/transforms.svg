<circle cx="451" cy="439" r="3" fill="#bf4d16"/>
<circle cx="451" cy="485" r="3" fill="#bf4d16"/>
<text x="648" y="317" fill="#18344a" font-family="sans-serif" font-size="17">S then T then R</text>
<path d="M 690 462 L 851 462" fill="none" stroke="#c0ccd5" stroke-width="1"/>
<path d="M 736 508 L 736 370" fill="none" stroke="#c0ccd5" stroke-width="1"/>
<text x="851" y="470.05" fill="#18344a" font-family="sans-serif" font-size="13">X</text>
<text x="739.45" y="370" fill="#18344a" font-family="sans-serif" font-size="13">Y</text>
<path d="M 736 462 L 759 462 L 759 416 L 736 416 Z" fill="none" stroke="#a4b3bf" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M 759 393 L 759 347 L 713 347 L 713 393 Z" fill="none" stroke="#bf4d16" stroke-width="3"/>
<circle cx="759" cy="393" r="3" fill="#bf4d16"/>
<circle cx="759" cy="347" r="3" fill="#bf4d16"/>
<circle cx="713" cy="347" r="3" fill="#bf4d16"/>
<circle cx="713" cy="393" r="3" fill="#bf4d16"/>
<text x="32" y="535" fill="#667987" font-family="sans-serif" font-size="15">Combined: (x, y) -&gt; (3 - y, 2x - 1). Reversing T and R rotates the translation.</text>
</svg>

<circle cx="736" cy="257" r="3" fill="#176cba"/>
<circle cx="736" cy="234" r="3" fill="#176cba"/>
<circle cx="690" cy="234" r="3" fill="#176cba"/>
<circle cx="690" cy="257" r="3" fill="#176cba"/>
